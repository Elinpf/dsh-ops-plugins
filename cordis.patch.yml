# ops-todo-tree: investigation tree plugin (host + client)
# The host row loads lib/index.js (tool + projection + systemPrompt).
# The client half (lib/client.js) is auto-discovered at runtime by
# ClientModuleRegistry from the dsh.client declaration in package.json —
# it does NOT need a separate cordis.yml row.
- insert:
    - id: ops-todo-tree
      name: '@deepseek-ai/dsh-ops-todo-tree'
